#:schema https://supabase.com/schemas/config/v1.json
project_id = "bio-link"

[api]
enabled = true
port = 54321
schemas = ["public"]
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false
minimum_password_length = 8

[auth.email.template.confirmation]
subject = "Xác nhận email cho bio-link"
content_path = "./supabase/templates/confirmation.html"

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
